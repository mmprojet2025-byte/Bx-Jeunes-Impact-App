spring.application.name=bx-jeunes-impact-api

server.port=8081
# Configuration de la base de données PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/bxji_dev
spring.datasource.username=postgres
spring.datasource.password=password

logging.level.org.flywaydb=DEBUG

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect



# ==========================================
# JWT SECURITY CONFIGURATION
# ==========================================
# Clé secrète générée (doit faire au moins 256 bits). À changer en production !
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Expiration du token d'accès : 1 jour (en millisecondes)
application.security.jwt.expiration=86400000
# Expiration du refresh token : 7 jours (en millisecondes)
application.security.jwt.refresh-token.expiration=604800000

# ==========================================
# CORS CONFIGURATION
# ==========================================
# Origines autorisées (à adapter pour Flutter Web / Mobile local)
application.cors.allowed-origins=http://localhost:8080,http://localhost:3000,http://localhost:59935