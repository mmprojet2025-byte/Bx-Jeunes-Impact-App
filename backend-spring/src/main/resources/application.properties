spring.application.name=bx-jeunes-impact-api

server.port=8081
# Configuration de la base de données PostgreSQL
# Les identifiants sont fournis par variables d'environnement (voir backend-spring/.env.example).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bxji_dev}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

logging.level.org.flywaydb=DEBUG

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect



# ==========================================
# JWT SECURITY CONFIGURATION
# ==========================================
# Clé secrète encodée en Base64 (au moins 256 bits), fournie par la variable JWT_SECRET_KEY.
# Générer une clé : openssl rand -base64 32 — ne jamais l'écrire dans ce fichier.
application.security.jwt.secret-key=${JWT_SECRET_KEY}
# Expiration du token d'accès : 1 jour (en millisecondes)
application.security.jwt.expiration=86400000
# Expiration du refresh token : 7 jours (en millisecondes)
application.security.jwt.refresh-token.expiration=604800000

# ==========================================
# CORS CONFIGURATION
# ==========================================
# Origines autorisées (à adapter pour Flutter Web / Mobile local)
application.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000,http://localhost:59935}